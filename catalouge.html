<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Giftlinks Product Catalogue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-top: 60px;
    }
    .product-card img {
      height: 250px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center mb-5">Our Product Catalogue</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4">
      <!-- Product 1 -->
      <div class="col">
        <div class="card product-card">
          <img src="img/tech.jpg" class="card-img-top" alt="Product 1">
          <div class="card-body text-center">
            <h5 class="card-title">Eco-Friendly Combo</h5>
          </div>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="col">
        <div class="card product-card">
          <img src="img/wellness.webp" class="card-img-top" alt="Product 2">
          <div class="card-body text-center">
            <h5 class="card-title">Work From Home Kit</h5>
          </div>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="col">
        <div class="card product-card">
          <img src="img/tech.jpg" class="card-img-top" alt="Product 3">
          <div class="card-body text-center">
            <h5 class="card-title">Premium Hamper</h5>
          </div>
        </div>
      </div>

      <!-- Add more cards as needed -->
    </div>

    <div class="text-center mt-5">
      <a href="index.html" class="btn btn-outline-primary">← Back to Home</a>
    </div>
  </div>
  <a href="cat.pdf" download class="btn btn-success">
    <i class="bi bi-download"></i> Download Catalogue
  </a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
