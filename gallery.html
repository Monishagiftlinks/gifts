<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GiftLinks Gallery</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Header -->
  <header class="bg-light py-2 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">GiftLinks India Pvt Ltd</h1>
      <nav>
        <a class="btn btn-outline-primary" href="Home.html">Back to Home</a>
      </nav>
    </div>
  </header>

  <!-- Gallery Section -->
  <section id="gallery" class="container py-5">
    <h2 class="text-center section-title mb-4">Our Gallery</h2>
    <div class="row g-4">
      <!-- Gallery Item 1 -->
      <div class="col-md-4">
        <div class="card">
          <img src="img/eco.jpg" class="card-img-top" alt="Product 1" data-bs-toggle="modal" data-bs-target="#lightboxModal" data-bs-img="https://via.placeholder.com/350x250">
        </div>
      </div>
      <!-- Gallery Item 2 -->
      <div class="col-md-4">
        <div class="card">
          <img src="img/tech.jpg" class="card-img-top" alt="Product 2" data-bs-toggle="modal" data-bs-target="#lightboxModal" data-bs-img="https://via.placeholder.com/350x250">
        </div>
      </div>
      <!-- Gallery Item 3 -->
      <div class="col-md-4">
        <div class="card">
          <img src="img/eco.jpg" class="card-img-top" alt="Product 3" data-bs-toggle="modal" data-bs-target="#lightboxModal" data-bs-img="https://via.placeholder.com/350x250">
        </div>
      </div>
      <!-- Add more gallery items here as needed -->
    </div>
  </section>

  <!-- Lightbox Modal -->
  <div class="modal fade" id="lightboxModal" tabindex="-1" aria-labelledby="lightboxModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body">
          <img id="modalImage" src="img/eco.jpg" alt="Product" class="img-fluid">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>

  <script>
    // Lightbox Image Click Event
    const galleryImages = document.querySelectorAll('.card-img-top');
    galleryImages.forEach(image => {
      image.addEventListener('click', function() {
        const imgSrc = this.getAttribute('data-bs-img');
        const modalImage = document.getElementById('modalImage');
        modalImage.src = imgSrc;
      });
    });
  </script>
</body>
</html>
